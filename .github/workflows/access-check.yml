name: Access check (no email)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-access-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned extractor and browser
        run: |
          git init .runtime/bpc-src
          git -C .runtime/bpc-src remote add origin https://github.com/Sophomoresty/bpc-fetch.git
          git -C .runtime/bpc-src fetch --depth=1 origin 76e24f51f4bc7b1ed9bd91418796f3cf104be56b
          git -C .runtime/bpc-src checkout --detach FETCH_HEAD
          python -m pip install -r requirements-bpc.txt
          python -m pip install --no-deps -e .runtime/bpc-src
          python -m playwright install --with-deps chromium
          python -m newsflow.browser_check
      - name: Test current directories and one fresh article per publisher
        run: python -m newsflow.access_check --sites-js .runtime/bpc-src/data/sites.js
      - name: Save metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: access-report-${{ github.run_id }}
          path: access-report/
          retention-days: 3
          if-no-files-found: warn
